# ─── FEAT-036 v2: 다중 NAS 서버 자동 업데이트 (배치 전송) ───────────────────
# main 브랜치에 push 되면 nas-registry.json 에 등록된 모든 NAS에 Webhook 전송
# 각 NAS는 POST /api/admin/update/webhook 을 받아 자동으로:
#   git fetch + git reset --hard origin/main + npm run build + pm2 restart
#
# ── NAS 목록 관리 방법 ────────────────────────────────────────────────────────
# nas-registry.json 파일에서 관리 (최대 100대+ 지원, Secret 1개만 필요)
#   - 새 NAS 추가: nas_list 배열에 항목 추가 후 git push
#   - 비활성화: active: false 설정
#   - 배치 크기/간격: batch_size / batch_delay_sec 조정
#
# ── GitHub Secrets 등록 필요 (1개만!) ────────────────────────────────────────
# DEPLOY_WEBHOOK_SECRET  : NAS 서버에 설정된 DEPLOY_WEBHOOK_SECRET 값 (동일값)
#
# ── NAS 서버 설정 필요 ────────────────────────────────────────────────────────
# .env 에 DEPLOY_WEBHOOK_SECRET=<시크릿값> 설정 후 pm2 restart
# ─────────────────────────────────────────────────────────────────────────────

name: 🚀 NAS 서버 자동 업데이트 (FEAT-036 v2)

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/build-apk.yml'

jobs:
  notify-nas-servers:
    name: 모든 NAS에 업데이트 Webhook 전송 (배치)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: NAS 업데이트 Webhook 배치 전송
        env:
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
        run: |
          SECRET="$DEPLOY_WEBHOOK_SECRET"

          if [ -z "$SECRET" ]; then
            echo "⚠️  DEPLOY_WEBHOOK_SECRET이 설정되지 않았습니다. Webhook을 전송하지 않습니다."
            exit 0
          fi

          if [ ! -f "nas-registry.json" ]; then
            echo "⚠️  nas-registry.json 파일이 없습니다. NAS 목록을 등록하세요."
            exit 0
          fi

          BATCH_SIZE=$(python3 -c "import json; d=json.load(open('nas-registry.json')); print(d.get('batch_size', 10))")
          BATCH_DELAY=$(python3 -c "import json; d=json.load(open('nas-registry.json')); print(d.get('batch_delay_sec', 5))")
          TOTAL=$(python3 -c "import json; d=json.load(open('nas-registry.json')); print(len([n for n in d['nas_list'] if n.get('active', True)]))")

          echo "📋 등록된 활성 NAS: ${TOTAL}대"
          echo "📦 배치 크기: ${BATCH_SIZE}대씩"
          echo "⏱️  배치 간격: ${BATCH_DELAY}초"
          echo ""

          if [ "$TOTAL" -eq 0 ]; then
            echo "⚠️  활성화된 NAS가 없습니다. nas-registry.json 을 확인하세요."
            exit 0
          fi

          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"

          PAYLOAD=$(cat <<EOF
          {
            "secret": "$SECRET",
            "commit": "$SHORT_SHA",
            "ref": "${{ github.ref_name }}"
          }
          EOF
          )

          send_webhook() {
            local url="$1"
            local label="$2"
            if [ -z "$url" ]; then
              echo "  [$label] URL 미설정 — skip"
              return 0
            fi
            HTTP_STATUS=$(curl -s -o /tmp/resp_${label}.txt -w "%{http_code}" \
              --max-time 30 \
              --retry 2 \
              --retry-delay 3 \
              -X POST \
              -H "Content-Type: application/json" \
              -k \
              -d "$PAYLOAD" \
              "${url}/api/admin/update/webhook" 2>&1)
            RESP=$(cat /tmp/resp_${label}.txt 2>/dev/null | head -c 100 || echo "")
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "  [$label] ✅ 성공 (HTTP 200)"
            else
              echo "  [$label] ⚠️  HTTP $HTTP_STATUS | $RESP"
            fi
          }

          BATCH_NUM=0

          NAS_LIST=$(python3 -c "
          import json
          d = json.load(open('nas-registry.json'))
          for n in d['nas_list']:
              if n.get('active', True):
                  print(f\"{n['id']}|{n['url']}\")
          ")

          BATCH_ITEMS=()
          while IFS= read -r line; do
            BATCH_ITEMS+=("$line")

            if [ "${#BATCH_ITEMS[@]}" -ge "$BATCH_SIZE" ]; then
              BATCH_NUM=$((BATCH_NUM + 1))
              echo "━━━ 배치 ${BATCH_NUM} (${#BATCH_ITEMS[@]}대) 전송 시작 ━━━"
              for item in "${BATCH_ITEMS[@]}"; do
                NAS_ID="${item%%|*}"
                NAS_URL="${item##*|}"
                send_webhook "$NAS_URL" "$NAS_ID" &
              done
              wait
              echo "  → 배치 ${BATCH_NUM} 완료. ${BATCH_DELAY}초 대기..."
              sleep "$BATCH_DELAY"
              BATCH_ITEMS=()
            fi
          done <<< "$NAS_LIST"

          if [ "${#BATCH_ITEMS[@]}" -gt 0 ]; then
            BATCH_NUM=$((BATCH_NUM + 1))
            echo "━━━ 배치 ${BATCH_NUM} (${#BATCH_ITEMS[@]}대, 마지막) 전송 시작 ━━━"
            for item in "${BATCH_ITEMS[@]}"; do
              NAS_ID="${item%%|*}"
              NAS_URL="${item##*|}"
              send_webhook "$NAS_URL" "$NAS_ID" &
            done
            wait
            echo "  → 배치 ${BATCH_NUM} 완료."
          fi

          echo ""
          echo "✅ 전체 NAS 업데이트 Webhook 전송 완료"
          echo "   대상: ${TOTAL}대 | 배치: ${BATCH_NUM}회 | commit: $SHORT_SHA"
