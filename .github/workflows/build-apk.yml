# ─── FEAT-035 v2: 다중 NAS APK 자동 배포 (배치 전송) ────────────────────────
# dist-apk/ 폴더에 APK 파일이 push 되면 nas-registry.json 에 등록된 모든 NAS에
# 배치 단위로 순차 Webhook 전송
# 각 NAS는 POST /api/dist/apk/webhook 을 받아 자동으로:
#   APK 다운로드(GitHub raw URL) → 로컬 저장 → DB 버전 정보 업데이트
#
# ── NAS 목록 관리 방법 ────────────────────────────────────────────────────────
# nas-registry.json 파일에서 관리 (최대 100대+ 지원, Secret 1개만 필요)
#   - 새 NAS 추가: nas_list 배열에 항목 추가 후 git push
#   - 비활성화: active: false 설정
#
# ── GitHub Secrets 등록 필요 ─────────────────────────────────────────────────
# DEPLOY_WEBHOOK_SECRET  : NAS 서버에 설정된 DEPLOY_WEBHOOK_SECRET 값 (동일값)
# GH_PAT                 : GitHub Personal Access Token (private repo APK 접근용)
#                          public repo 인 경우 불필요
#
# ── APK 버전 관리 방법 ────────────────────────────────────────────────────────
# dist-apk/version.txt   : APK 버전 문자열 (예: 1.4.14)
# dist-apk/release.txt   : 릴리스 노트 (선택)
# dist-apk/safetynote.apk: 실제 APK 파일
# ─────────────────────────────────────────────────────────────────────────────

name: 📱 NAS APK 자동 배포 (FEAT-035 v2)

on:
  push:
    branches: [main]
    paths:
      - 'dist-apk/**'

jobs:
  deploy-apk:
    name: 모든 NAS에 APK 배포 Webhook 전송 (배치)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: APK 정보 읽기
        id: apk_info
        run: |
          if [ -f "dist-apk/version.txt" ]; then
            VERSION=$(cat dist-apk/version.txt | tr -d '[:space:]')
          else
            VERSION="unknown"
          fi

          if [ -f "dist-apk/release.txt" ]; then
            RELEASE_NOTE=$(cat dist-apk/release.txt | head -5 | tr '\n' ' ')
          else
            RELEASE_NOTE=""
          fi

          REPO="${{ github.repository }}"
          SHA="${{ github.sha }}"
          APK_URL="https://raw.githubusercontent.com/${REPO}/${SHA}/dist-apk/safetynote.apk"

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "release_note=$RELEASE_NOTE" >> $GITHUB_OUTPUT
          echo "apk_url=$APK_URL" >> $GITHUB_OUTPUT

          echo "📱 APK 버전: $VERSION"
          echo "🔗 APK URL: $APK_URL"

      - name: APK 파일 존재 확인
        run: |
          if [ ! -f "dist-apk/safetynote.apk" ]; then
            echo "⚠️  dist-apk/safetynote.apk 파일이 없습니다."
            exit 1
          fi
          SIZE=$(du -sh dist-apk/safetynote.apk | cut -f1)
          echo "✅ APK 확인: dist-apk/safetynote.apk ($SIZE)"

      - name: NAS APK Webhook 배치 전송
        env:
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          VERSION="${{ steps.apk_info.outputs.version }}"
          RELEASE_NOTE="${{ steps.apk_info.outputs.release_note }}"
          APK_URL="${{ steps.apk_info.outputs.apk_url }}"
          SECRET="$DEPLOY_WEBHOOK_SECRET"

          if [ -z "$SECRET" ]; then
            echo "⚠️  DEPLOY_WEBHOOK_SECRET이 설정되지 않았습니다."
            exit 0
          fi

          if [ ! -f "nas-registry.json" ]; then
            echo "⚠️  nas-registry.json 파일이 없습니다."
            exit 0
          fi

          if [ -n "$GH_PAT" ]; then
            APK_URL_WITH_TOKEN=$(echo "$APK_URL" | sed "s|https://raw.githubusercontent.com|https://${GH_PAT}@raw.githubusercontent.com|")
          else
            APK_URL_WITH_TOKEN="$APK_URL"
          fi

          BATCH_SIZE=$(python3 -c "import json; d=json.load(open('nas-registry.json')); print(d.get('batch_size', 10))")
          BATCH_DELAY=$(python3 -c "import json; d=json.load(open('nas-registry.json')); print(d.get('batch_delay_sec', 5))")
          TOTAL=$(python3 -c "import json; d=json.load(open('nas-registry.json')); print(len([n for n in d['nas_list'] if n.get('active', True)]))")

          echo "📋 등록된 활성 NAS: ${TOTAL}대"
          echo "📦 배치 크기: ${BATCH_SIZE}대씩"
          echo "⏱️  배치 간격: ${BATCH_DELAY}초"
          echo "📱 APK 버전: v${VERSION}"
          echo ""

          if [ "$TOTAL" -eq 0 ]; then
            echo "⚠️  활성화된 NAS가 없습니다."
            exit 0
          fi

          PAYLOAD=$(cat <<EOF
          {
            "secret": "$SECRET",
            "version": "$VERSION",
            "apk_url": "$APK_URL_WITH_TOKEN",
            "release_note": "$RELEASE_NOTE",
            "force_update": "0"
          }
          EOF
          )

          send_apk_webhook() {
            local url="$1"
            local label="$2"
            if [ -z "$url" ]; then
              echo "  [$label] URL 미설정 — skip"
              return 0
            fi
            HTTP_STATUS=$(curl -s -o /tmp/resp_apk_${label}.txt -w "%{http_code}" \
              --max-time 60 \
              --retry 2 \
              --retry-delay 5 \
              -X POST \
              -H "Content-Type: application/json" \
              -k \
              -d "$PAYLOAD" \
              "${url}/api/dist/apk/webhook" 2>&1)
            RESP=$(cat /tmp/resp_apk_${label}.txt 2>/dev/null | head -c 100 || echo "")
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "  [$label] ✅ APK 배포 성공 (v${VERSION})"
            else
              echo "  [$label] ⚠️  HTTP $HTTP_STATUS | $RESP"
            fi
          }

          BATCH_NUM=0

          NAS_LIST=$(python3 -c "
          import json
          d = json.load(open('nas-registry.json'))
          for n in d['nas_list']:
              if n.get('active', True):
                  print(f\"{n['id']}|{n['url']}\")
          ")

          BATCH_ITEMS=()
          while IFS= read -r line; do
            BATCH_ITEMS+=("$line")

            if [ "${#BATCH_ITEMS[@]}" -ge "$BATCH_SIZE" ]; then
              BATCH_NUM=$((BATCH_NUM + 1))
              echo "━━━ 배치 ${BATCH_NUM} (${#BATCH_ITEMS[@]}대) APK 배포 시작 ━━━"
              for item in "${BATCH_ITEMS[@]}"; do
                NAS_ID="${item%%|*}"
                NAS_URL="${item##*|}"
                send_apk_webhook "$NAS_URL" "$NAS_ID" &
              done
              wait
              echo "  → 배치 ${BATCH_NUM} 완료. ${BATCH_DELAY}초 대기..."
              sleep "$BATCH_DELAY"
              BATCH_ITEMS=()
            fi
          done <<< "$NAS_LIST"

          if [ "${#BATCH_ITEMS[@]}" -gt 0 ]; then
            BATCH_NUM=$((BATCH_NUM + 1))
            echo "━━━ 배치 ${BATCH_NUM} (${#BATCH_ITEMS[@]}대, 마지막) APK 배포 시작 ━━━"
            for item in "${BATCH_ITEMS[@]}"; do
              NAS_ID="${item%%|*}"
              NAS_URL="${item##*|}"
              send_apk_webhook "$NAS_URL" "$NAS_ID" &
            done
            wait
            echo "  → 배치 ${BATCH_NUM} 완료."
          fi

          echo ""
          echo "✅ 전체 NAS APK 배포 Webhook 전송 완료"
          echo "   대상: ${TOTAL}대 | 배치: ${BATCH_NUM}회 | v${VERSION}"
