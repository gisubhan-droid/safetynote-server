<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>작업명 자동입력 미리보기 v2</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body { background: #f3f4f6; font-family: 'Malgun Gothic', sans-serif; }
    .form-label { display: block; font-size: 13px; font-weight: 600; color: #374151; }
    .form-control { width: 100%; border: 1px solid #D1D5DB; border-radius: 8px; padding: 8px 12px; font-size: 14px; color: #111827; outline: none; transition: border 0.15s; box-sizing: border-box; }
    .form-control:focus { border-color: #685182; box-shadow: 0 0 0 3px rgba(104,81,130,0.1); }
    .form-group { margin-bottom: 14px; }
    .modal { background: white; border-radius: 16px; padding: 0; width: 560px; max-width: 98vw; box-shadow: 0 20px 60px rgba(0,0,0,0.18); }
    .modal-header { background: linear-gradient(135deg, #4E3A63, #685182); color: white; padding: 16px 20px; border-radius: 16px 16px 0 0; }
    .modal-body { padding: 20px; }
    .btn-primary { background: #685182; color: white; border: none; border-radius: 8px; padding: 10px 22px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .btn-primary:hover { background: #4E3A63; }
    .btn-outline { background: white; color: #685182; border: 1.5px solid #685182; border-radius: 8px; padding: 10px 22px; font-size: 14px; font-weight: 600; cursor: pointer; }

    /* ── 자동입력 체크박스 (작업명 label 우측) ── */
    .auto-cb-label {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 12px; font-weight: 600; color: #9CA3AF;
      cursor: pointer; user-select: none;
      padding: 3px 8px;
      border-radius: 6px;
      border: 1.5px solid #E5E7EB;
      background: #F9FAFB;
      transition: all 0.15s;
    }
    .auto-cb-label:hover { border-color: #C4ADE0; color: #685182; background: #F5F0FA; }
    .auto-cb-label.on { border-color: #685182; color: #685182; background: #F0EBF8; font-weight: 700; }
    .auto-cb-label input[type=checkbox] { width: 13px; height: 13px; accent-color: #685182; cursor: pointer; margin: 0; }

    /* ── 작업명 input: 자동입력 ON 강조 ── */
    .title-auto { border-color: #685182 !important; background: #FDFAFF !important; }

    /* ── prefix 미리보기 한 줄 (input 아래) ── */
    .prefix-hint {
      font-size: 11.5px; color: #A78BCA; margin-top: 4px;
      display: flex; align-items: center; gap: 5px;
      min-height: 18px;
    }
    .prefix-hint .tag {
      display: inline-block; background: #685182; color: #fff;
      font-size: 10px; font-weight: 700; padding: 1px 6px;
      border-radius: 4px; letter-spacing: 0.03em;
    }

    /* ── 상태 바 ── */
    .status-bar {
      display: none; align-items: center; gap: 6px;
      background: #F0FDF4; border: 1px solid #BBF7D0; border-radius: 8px;
      padding: 7px 12px; font-size: 12px; color: #166534; margin-top: 2px;
    }
    .status-bar.show { display: flex; }
  </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-6 gap-10">

  <!-- ───────── 케이스 A: 체크박스 OFF (수정 모달 기본) ───────── -->
  <div>
    <div class="text-center mb-3">
      <span class="inline-block bg-gray-200 text-gray-600 text-xs font-bold px-3 py-1 rounded-full">체크박스 OFF — 자유 입력 (수정 모달 기본값)</span>
    </div>
    <div class="modal">
      <div class="modal-header">
        <h3 class="font-bold text-base text-white"><i class="fas fa-edit mr-2"></i>작업 수정</h3>
      </div>
      <div class="modal-body">
        <div class="grid grid-cols-2 gap-x-4">

          <!-- 작업명 — label 우측에 체크박스 -->
          <div class="form-group col-span-2">
            <div class="flex items-center justify-between mb-1">
              <label class="form-label">작업명 <span class="text-red-500">*</span></label>
              <label class="auto-cb-label" id="cbWrapA">
                <input type="checkbox" id="cbA" onchange="onCbA()">
                <i class="fas fa-magic" style="font-size:10px"></i>작업명 자동입력
              </label>
            </div>
            <input id="titleA" type="text" class="form-control"
              value="이천시 신둔면 도암리 789-5 광탭 장애 긴급복구건">
            <div class="prefix-hint" id="hintA"></div>
          </div>

          <!-- 작업종류 -->
          <div class="form-group">
            <label class="form-label mb-1"><i class="fas fa-layer-group mr-1" style="color:#685182"></i>작업종류 <span class="text-red-500">*</span></label>
            <select id="wcA" class="form-control" onchange="onChangeA()">
              <option value="cable_install" selected>외선</option>
              <option value="cable_splice">접속</option>
              <option value="equipment_other">장비</option>
              <option value="conduit">관로</option>
            </select>
          </div>

          <!-- 상세분류 -->
          <div class="form-group">
            <label class="form-label mb-1"><i class="fas fa-list-ul mr-1" style="color:#685182"></i>상세분류 <span class="text-red-500">*</span></label>
            <select id="subA" class="form-control" onchange="onChangeA()">
              <option value="lay" selected>포설</option>
              <option value="remove">철거</option>
              <option value="cut">단순</option>
              <option value="pole">전주건식</option>
            </select>
          </div>

        </div>
        <div class="flex justify-end gap-2 mt-1">
          <button class="btn-outline">취소</button>
          <button class="btn-primary"><i class="fas fa-save mr-1"></i>수정 저장</button>
        </div>
      </div>
    </div>
  </div>


  <!-- ───────── 케이스 B: 체크박스 ON (신규 등록 기본) ───────── -->
  <div>
    <div class="text-center mb-3">
      <span class="inline-block bg-purple-100 text-purple-700 text-xs font-bold px-3 py-1 rounded-full">✨ 체크박스 ON — 자동입력 활성 (신규 등록 기본값)</span>
    </div>
    <div class="modal">
      <div class="modal-header">
        <h3 class="font-bold text-base text-white"><i class="fas fa-plus mr-2"></i>작업 등록</h3>
      </div>
      <div class="modal-body">
        <div class="grid grid-cols-2 gap-x-4">

          <!-- 작업명 — label 우측에 체크박스 ON -->
          <div class="form-group col-span-2">
            <div class="flex items-center justify-between mb-1">
              <label class="form-label">작업명 <span class="text-red-500">*</span></label>
              <label class="auto-cb-label on" id="cbWrapB">
                <input type="checkbox" id="cbB" checked onchange="onCbB()">
                <i class="fas fa-magic" style="font-size:10px"></i>작업명 자동입력
              </label>
            </div>
            <input id="titleB" type="text" class="form-control title-auto"
              value="[외선][포설]이천시 신둔면 도암리 789-5 광탭 장애 긴급복구건">
            <!-- prefix 힌트 한 줄 -->
            <div class="prefix-hint" id="hintB">
              <span class="tag"><i class="fas fa-magic mr-1" style="font-size:9px"></i>자동</span>
              맨 앞에 <strong style="color:#685182">&nbsp;[외선][포설]&nbsp;</strong> 삽입 중 — 변경 시 자동 갱신
            </div>
          </div>

          <!-- 작업종류 -->
          <div class="form-group">
            <label class="form-label mb-1"><i class="fas fa-layer-group mr-1" style="color:#685182"></i>작업종류 <span class="text-red-500">*</span></label>
            <select id="wcB" class="form-control" onchange="onChangeB()">
              <option value="cable_install" selected>외선</option>
              <option value="cable_splice">접속</option>
              <option value="equipment_other">장비</option>
              <option value="conduit">관로</option>
            </select>
          </div>

          <!-- 상세분류 -->
          <div class="form-group">
            <label class="form-label mb-1"><i class="fas fa-list-ul mr-1" style="color:#685182"></i>상세분류 <span class="text-red-500">*</span></label>
            <select id="subB" class="form-control" onchange="onChangeB()">
              <option value="lay" selected>포설</option>
              <option value="remove">철거</option>
              <option value="cut">단순</option>
              <option value="pole">전주건식</option>
            </select>
          </div>

        </div>
        <div class="flex justify-end gap-2 mt-1">
          <button class="btn-outline">취소</button>
          <button class="btn-primary"><i class="fas fa-save mr-1"></i>등록</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 인터랙티브 데모 안내 -->
  <p class="text-xs text-gray-400 pb-6">※ 체크박스 ON/OFF, 작업종류·상세분류 변경으로 동작을 직접 확인하세요</p>

<script>
var WORK_CLASS_DEF = [
  { key:'cable_install', label:'외선', subClasses:[{key:'lay',label:'포설'},{key:'remove',label:'철거'},{key:'cut',label:'단순'},{key:'pole',label:'전주건식'}] },
  { key:'cable_splice',  label:'접속', subClasses:[{key:'core',label:'코어구성'},{key:'switch',label:'절체접속'},{key:'survey',label:'선번조사'}] },
  { key:'equipment_other',label:'장비',subClasses:[{key:'install',label:'장비시설'},{key:'env',label:'환경공사'}] },
  { key:'conduit',       label:'관로', subClasses:[{key:'main',label:'주관로'},{key:'entry',label:'인입관로'}] },
];

function getWcLabel(wc)  { var d=WORK_CLASS_DEF.find(function(x){return x.key===wc;}); return d?d.label:wc; }
function getSubLabel(wc,sub) { var d=WORK_CLASS_DEF.find(function(x){return x.key===wc;}); if(!d) return sub; var s=d.subClasses.find(function(x){return x.key===sub;}); return s?s.label:sub; }
function makePrefix(wc,sub) { return '['+getWcLabel(wc)+']['+getSubLabel(wc,sub)+']'; }

var PREFIX_RE = /^(\[[^\]]+\]\[[^\]]+\])/;
function applyPrefix(titleEl, prefix) {
  var cur = titleEl.value;
  var bare = cur.replace(PREFIX_RE,'');
  titleEl.value = prefix + bare;
}

function rebuildSubSelect(sel, wc, currentSub) {
  var def = WORK_CLASS_DEF.find(function(d){return d.key===wc;});
  if (!def) return;
  sel.innerHTML = def.subClasses.map(function(s){
    return '<option value="'+s.key+'"'+(s.key===currentSub?' selected':'')+'>'+s.label+'</option>';
  }).join('');
}

/* ── 케이스 A (수정 모달) ── */
function onChangeA() {
  var cb = document.getElementById('cbA');
  if (!cb.checked) return;
  var wc = document.getElementById('wcA').value;
  var subSel = document.getElementById('subA');
  rebuildSubSelect(subSel, wc, subSel.value);
  var prefix = makePrefix(wc, subSel.value);
  applyPrefix(document.getElementById('titleA'), prefix);
  updateHintA(wc, subSel.value);
}
function onCbA() {
  var cb = document.getElementById('cbA');
  var wrap = document.getElementById('cbWrapA');
  var titleEl = document.getElementById('titleA');
  if (cb.checked) {
    wrap.classList.add('on');
    titleEl.classList.add('title-auto');
    var wc = document.getElementById('wcA').value;
    var sub = document.getElementById('subA').value;
    applyPrefix(titleEl, makePrefix(wc, sub));
    updateHintA(wc, sub);
  } else {
    wrap.classList.remove('on');
    titleEl.classList.remove('title-auto');
    document.getElementById('hintA').innerHTML = '';
  }
}
function updateHintA(wc, sub) {
  var p = makePrefix(wc, sub);
  document.getElementById('hintA').innerHTML =
    '<span class="tag"><i class="fas fa-magic mr-1" style="font-size:9px"></i>자동</span>'
    +'맨 앞에 <strong style="color:#685182">&nbsp;'+p+'&nbsp;</strong> 삽입 중 — 변경 시 자동 갱신';
}

/* ── 케이스 B (신규 등록) ── */
function onChangeB() {
  var cb = document.getElementById('cbB');
  if (!cb.checked) return;
  var wc = document.getElementById('wcB').value;
  var subSel = document.getElementById('subB');
  rebuildSubSelect(subSel, wc, subSel.value);
  var prefix = makePrefix(wc, subSel.value);
  applyPrefix(document.getElementById('titleB'), prefix);
  updateHintB(wc, subSel.value);
}
function onCbB() {
  var cb = document.getElementById('cbB');
  var wrap = document.getElementById('cbWrapB');
  var titleEl = document.getElementById('titleB');
  if (cb.checked) {
    wrap.classList.add('on');
    titleEl.classList.add('title-auto');
    var wc = document.getElementById('wcB').value;
    var sub = document.getElementById('subB').value;
    applyPrefix(titleEl, makePrefix(wc, sub));
    updateHintB(wc, sub);
  } else {
    wrap.classList.remove('on');
    titleEl.classList.remove('title-auto');
    document.getElementById('hintB').innerHTML = '';
  }
}
function updateHintB(wc, sub) {
  var p = makePrefix(wc, sub);
  document.getElementById('hintB').innerHTML =
    '<span class="tag"><i class="fas fa-magic mr-1" style="font-size:9px"></i>자동</span>'
    +'맨 앞에 <strong style="color:#685182">&nbsp;'+p+'&nbsp;</strong> 삽입 중 — 변경 시 자동 갱신';
}
</script>
</body>
</html>
